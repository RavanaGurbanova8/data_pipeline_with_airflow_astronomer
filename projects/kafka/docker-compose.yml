x-airflow-common:
  &airflow-common
  image: apache/airflow:3.1.0
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API_AUTH__JWT_SECRET: 'a-very-secret-key-change-me'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API__BASE_URL: 'http://localhost:8080'
    AIRFLOW_DB_MIGRATE: 'true'
    AIRFLOW_WWW_USER_CREATE: 'true'
    AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
    AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    - postgres

services:
  # ---------- KAFKA ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    networks:
      - lab-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - lab-net

  # ---------- AIRFLOW ----------
  postgres:
    image: postgres:15
    container_name: kafka-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - lab-net

  airflow-init:
    <<: *airflow-common
    container_name: kafka-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    networks:
      - lab-net

  airflow-apiserver:
    <<: *airflow-common
    container_name: kafka-airflow-apiserver
    restart: always
    depends_on:
      - postgres
      - airflow-init
    command: api-server
    ports:
      - "8080:8080"
    networks:
      - lab-net

  airflow-scheduler:
    <<: *airflow-common
    container_name: kafka-airflow-scheduler
    restart: always
    depends_on:
      - postgres
      - airflow-init
    command: scheduler
    networks:
      - lab-net

  airflow-dag-processor:
    <<: *airflow-common
    container_name: kafka-airflow-dag-processor
    restart: always
    depends_on:
      - postgres
      - airflow-init
    command: dag-processor
    networks:
      - lab-net

  airflow-triggerer:
    <<: *airflow-common
    container_name: kafka-airflow-triggerer
    restart: always
    depends_on:
      - postgres
      - airflow-init
    command: triggerer
    networks:
      - lab-net

volumes:
  postgres-db-volume:

networks:
  lab-net:
    driver: bridge